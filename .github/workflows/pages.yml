name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Check that every local file the page references exists
        run: |
          missing=0
          for f in $(grep -oE '(src|href|poster)="(assets/[^"]+|[^":#]+\.pdf)"' index.html | cut -d'"' -f2 | sort -u); do
            [ -f "$f" ] || { echo "missing: $f"; missing=1; }
          done
          for id in $(grep -oE 'data-(tools|stack)="[^"]+"' index.html | cut -d'"' -f2 | tr ',' '\n' | cut -d: -f1 | sort -u); do
            [ -z "$id" ] || [ -f "assets/logos/$id.svg" ] || { echo "missing logo: $id"; missing=1; }
          done
          exit $missing
      - name: Collect the site
        run: mkdir _site && cp -r index.html assets Moaz_Elgendy_CV.pdf _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
